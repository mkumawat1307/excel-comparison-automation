[project]
name = "excel-comparison-automation"
version = "0.1.0"
description = "Excel Comparison Automation for business users"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "PLC", "TRY"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
